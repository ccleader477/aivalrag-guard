[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivalrag-guard"
version = "0.2.0"
description = "Shared prompt-injection defense primitives for aivalrag-chat and AIValRAG-Backend"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "boto3>=1.34"]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["aivalrag_guard*"]
